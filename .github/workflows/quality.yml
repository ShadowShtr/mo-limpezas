# =============================================================================
# Gate de qualidade — corre em cada pull request
# =============================================================================
# Fecha a pendência deixada pela Task T02: os gates existiam como comandos npm,
# mas não corriam em lado nenhum automaticamente. Na prática,
# `no-unused-vars: error` só falhava para quem se lembrasse de correr o lint.
#
# O que este workflow NÃO faz, deliberadamente:
#   - não usa segredos;
#   - não liga ao Supabase, à Vercel ou a qualquer serviço externo;
#   - não usa variáveis de ambiente reais. O `npm run build` **passou a
#     correr**, com placeholders óbvios: o `prebuild` só verifica que as
#     variáveis existem, não que são válidas, e a compilação não liga a
#     serviço nenhum;
#   - não corre `npm run audit:code:json` — o relatório versionado é escrito
#     pelo autor da alteração, com `git add` antes, e nunca regenerado
#     automaticamente aqui;
#   - não aplica migrations, não faz deploy, não faz merge.
#
# Ver docs/ENGINEERING-STANDARD.md (Definition of Done) e
# docs/code-audit/lint-baseline.md (baseline medido).
# =============================================================================

name: Qualidade

on:
  pull_request:
  push:
    branches: [master]

# Sem segredos e sem escrita: o workflow só precisa de ler o código.
permissions:
  contents: read

# Uma alteração nova cancela a verificação anterior do mesmo ramo.
concurrency:
  group: qualidade-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: typecheck · lint · testes · auditoria · build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # O commit exato do ramo, não o merge simulado com a base.
          #
          # `reports/code-audit.json` é versionado e tem de bater certo com a
          # árvore do commit que o acompanha — há um teste que o verifica
          # (src/__tests__/audit-codebase.test.ts). Num merge simulado, a
          # árvore é a combinação com a base e o relatório deixaria de bater
          # certo, produzindo falhas que não são do autor.
          #
          # Em `push` para master este valor é vazio e o checkout usa o
          # comportamento normal.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Node
        uses: actions/setup-node@v7
        with:
          # Versão fixa, igual à de desenvolvimento. Next 16 exige >= 20.9.0.
          # Ao subir aqui, subir também no ambiente local.
          node-version: '24.16.0'
          # Cacheia apenas a cache do npm, com chave derivada do
          # package-lock.json. Nunca node_modules, nunca .next — uma cache de
          # artefactos construídos poderia mascarar uma falha real.
          cache: 'npm'

      - name: Instalar dependências
        # `npm ci` respeita o lockfile exatamente e falha se ele estiver
        # dessincronizado do package.json — que é a verificação que queremos.
        run: npm ci

      - name: Verificar segredos versionados
        # Antes dos testes de propósito: uma credencial no repositório é o
        # problema mais urgente que este workflow pode encontrar, e não faz
        # sentido gastar minutos a compilar antes de o reportar.
        # O scanner nunca imprime o valor encontrado — só ficheiro, linha e tipo.
        run: npm run secrets:scan

      - name: Verificar tipos
        run: npm run typecheck

      - name: Lint estrito
        run: npm run lint:strict

      - name: Testes
        run: npm test

      - name: Auditoria do código
        # Falha se aparecer um risco de confiança alta: artefacto capaz de
        # destruir ou popular uma base real, `createAdminClient` num client
        # component, ou `auth.signUp` em código de produção.
        run: npm run audit:code:strict

      - name: Build
        # ─────────────────────────────────────────────────────────────────────
        # 🔴 Porque é que isto passou a ser obrigatório
        #
        # Há erros que só a compilação apanha. O mais recente:
        #
        #     Server Actions must be async functions.
        #       src/app/actions/finance-dashboard-v2.ts
        #       export function construirContexto(...)
        #
        # Num ficheiro `"use server"` cada export torna-se um endpoint RPC, e o
        # Next recusa exportar uma função síncrona. Nem o `tsc` nem o ESLint
        # vêem isto — e o CI ficou verde num commit que não compilava.
        #
        # É a segunda vez que a mesma regra morde o projecto. A primeira foi
        # `CANCEL_TYPE_LABELS`, em 2026-06-08: um objecto exportado de um
        # ficheiro `"use server"` bloqueou todas as notificações do calendário,
        # e só se descobriu em runtime.
        #
        # ─────────────────────────────────────────────────────────────────────
        # Porque é que os valores abaixo são falsos, e têm de ser
        #
        # O `prebuild` (`scripts/check-env.ts`) verifica que as variáveis
        # **existem**, não que são válidas. A compilação não liga ao Supabase,
        # à Vercel nem a nada.
        #
        # Estes placeholders são deliberadamente reconhecíveis como falsos, e o
        # workflow continua sem segredos — que é uma propriedade a manter, não
        # uma limitação a contornar. Pôr aqui as chaves reais daria a este
        # workflow acesso à base de produção para ganhar exactamente nada.
        #
        # Consequência aceite: o artefacto que sai daqui **não é implantável**.
        # As `NEXT_PUBLIC_*` ficam inlined com os valores falsos. Não faz mal —
        # este passo prova que o código compila, e quem implanta é a Vercel,
        # que constrói à parte com as variáveis verdadeiras.
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci-placeholder
          RESEND_API_KEY: re_ci_placeholder
          RESEND_FROM_EMAIL: CI <ci@example.invalid>
          NEXT_PUBLIC_VAPID_PUBLIC_KEY: ci-placeholder-vapid-public
          VAPID_PRIVATE_KEY: ci-placeholder-vapid-private
          CRON_SECRET: ci-placeholder-cron-secret
        run: npm run build
